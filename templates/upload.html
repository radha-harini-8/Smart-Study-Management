{% extends 'base.html' %}{% block content %}<section class="page-head"><p class="eyebrow">CONTRIBUTE</p><h1>Add a resource with context.</h1><p>Rich metadata makes every upload easier to discover, recommend, and revise from.</p></section><form class="form-card wide" method="post" enctype="multipart/form-data"><div class="two"><label>Resource title<input required name="title" placeholder="e.g. DBMS Unit 3 Notes"></label><label>Resource type<select required name="resource_type"><option>Notes</option><option>Question Paper</option><option>Assignment</option><option>Lab Material</option><option>PPT</option><option>Important Questions</option></select></label></div><label>Description<textarea name="description" placeholder="What will students learn from this resource?"></textarea></label><div class="three"><label>Department<select name="department">{% for d in departments %}<option value="{{d.id}}">{{d.name}}</option>{% endfor %}</select></label><label>Academic year<input required name="academic_year" value="{{current_user.academic_year or ''}}"></label><label>Semester<input required name="semester" placeholder="e.g. 1"></label></div><div class="three"><label>Subject<select name="subject"><option value="">Select subject</option>{% for s in subjects %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></label><label>Unit<input name="unit" placeholder="e.g. Unit 3"></label><label>Topic<input name="topic" placeholder="e.g. Normalization"></label></div><div class="two"><label>Tags / keywords<input name="tags" placeholder="dbms, bcnf, functional dependencies"></label><label>Exam type (papers)<input name="exam_type" placeholder="e.g. End Semester"></label></div><label>Attach file (PDF, PPT, document, image)<input name="file" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.jpg,.jpeg,.png"></label><button class="button">Publish resource →</button></form>{% endblock %}
