{% extends 'base.html' %}{% block content %}<section class="auth"><div><p class="eyebrow">JOIN SMARTSTUDY</p><h1>A better way<br>to study.</h1><p>Build your personal library and discover resources that fit your course.</p></div><form class="form-card" method="post"><h2>Create account</h2><label>Full name<input required name="name"></label><label>College email<input required type="email" name="email"></label><label>Password<input required minlength="6" type="password" name="password"></label><label>I am a<select name="role"><option value="student">Student</option><option value="faculty">Faculty</option></select></label><label>Department<select name="department">{% for d in departments %}<option value="{{d.id}}">{{d.name}}</option>{% endfor %}</select></label><label>Academic year<input name="academic_year" placeholder="e.g. 3"></label><button class="button">Create account →</button></form></section>{% endblock %}
