<article class="resource-card"><div class="card-top"><span class="chip">{{r.resource_type}}</span><span class="rating">★ {{r.average_rating or 'New'}}</span></div><h3><a href="{{url_for('resource_detail',resource_id=r.id)}}">{{r.title}}</a></h3><p>{{r.description[:105] }}{% if r.description|length > 105 %}…{% endif %}</p><div class="card-meta"><span>{{r.subject.name if r.subject else 'General'}}</span><span>{{r.unit}}</span></div><div class="card-footer"><span>{{r.view_count}} views</span><a href="{{url_for('resource_detail',resource_id=r.id)}}">Open →</a></div></article>
